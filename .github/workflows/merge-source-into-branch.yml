name: Merge source into release branch

on:
  workflow_call:
    inputs:
      source-branch:
        description: 'Branch, der gemerged wird. Ohne Angabe der Branch, aus dem der Workflow gestartet wurde.'
        required: false
        type: string
        default: ${{ github.ref_name }}
      target-branch:
        required: true
        type: string
      auto_build:
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: merge-into-${{ inputs.target-branch }}
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest

    env:
      TARGET_BRANCH: ${{ inputs.target-branch }}
      SOURCE_BRANCH: ${{ inputs.source-branch }}
      AUTO_BUILD: ${{ inputs.auto_build }}

    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.OO_ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.OO_ACTIONS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ github.event.repository.name }}

      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source-branch }}
          fetch-depth: 0
          fetch-tags: true
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Validate stable release source
        if: inputs.target-branch == 'release'
        run: |
          if [ "${SOURCE_BRANCH}" != "prerelease" ]; then
            echo "::error::Stable releases must be created from prerelease, not ${SOURCE_BRANCH}."
            exit 1
          fi

      - name: Merge source into target branch
        id: merge
        run: |
          set -e
          git fetch origin "${SOURCE_BRANCH}" --tags

          if git ls-remote --exit-code --heads origin "${TARGET_BRANCH}" > /dev/null 2>&1; then
            git fetch origin "${TARGET_BRANCH}" --tags
            git checkout -q -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          else
            git checkout -B "${TARGET_BRANCH}" "origin/${SOURCE_BRANCH}"
          fi

          # Merge commit keeps both histories, but the tree is taken verbatim from the
          # source branch. Anything that exists only on the target is removed on purpose,
          # so the target always ends up identical to the source.
          SRC="origin/${SOURCE_BRANCH}"
          # Nothing new to release: pushing anyway would move ${TARGET_BRANCH} forward by
          # an empty commit and desync it from ${SOURCE_BRANCH}, so stop here instead.
          if git merge-base --is-ancestor "$SRC" HEAD && git diff --quiet "$SRC" HEAD; then
            echo "::notice::${TARGET_BRANCH} already contains every commit from ${SOURCE_BRANCH}. There is nothing new to release, stopping without a merge or push."
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          else
            LOST=$(git log --oneline "$SRC..HEAD")
            if [ -n "$LOST" ]; then
              if [ "${TARGET_BRANCH}" = "release" ]; then
                echo "::error::${TARGET_BRANCH} carries commits that are not in ${SOURCE_BRANCH}. Merging would roll their content back. Merge them into ${SOURCE_BRANCH} first, then start this workflow again."
                echo "$LOST" | sed 's/^/  /'
                exit 1
              fi
              # On prerelease these are the release automation commits: version bumps,
              # POEditor sync and the -s ours merge of release. They are expected here and
              # semantic-release recreates them right after this merge.
              echo "::notice::Commits on ${TARGET_BRANCH} whose content is replaced by ${SOURCE_BRANCH}:"
              echo "$LOST" | sed 's/^/  /'
            fi
            # No "|| true": a failing merge must fail the job. -s ours cannot
            # conflict, it only returns non-zero on a real git error.
            git merge --no-commit --no-ff -s ours "$SRC"
            git read-tree -u --reset "$SRC"
            if git rev-parse -q --verify MERGE_HEAD >/dev/null; then
              git commit --no-edit -m "Merge ${SOURCE_BRANCH} into ${TARGET_BRANCH}"
            elif ! git diff --cached --quiet; then
              # Source was already an ancestor, only the tree needed correcting
              git commit -m "chore: sync ${TARGET_BRANCH} with ${SOURCE_BRANCH}"
            else
              echo "Nothing to commit, ${TARGET_BRANCH} already matches ${SOURCE_BRANCH}."
            fi
          fi

          # The target tree is taken verbatim from the source, so it must now be identical.
          DRIFT=$(git diff --name-status "$SRC" HEAD)
          if [ -n "$DRIFT" ]; then
            echo "::error::${TARGET_BRANCH} still differs from ${SOURCE_BRANCH} after the merge."
            echo "$DRIFT" | sed 's/^/  /'
            exit 1
          fi

          # release.yml reads the latest commit trailer on prerelease pushes and forwards it to the beta deploy job.
          if [ "${TARGET_BRANCH}" = "prerelease" ] && [ "${AUTO_BUILD}" = "true" ]; then
            git commit --allow-empty -m "ci(release): request beta auto-build" -m "Auto-Build: true"
          fi

          if ! git push origin "HEAD:${TARGET_BRANCH}"; then
            echo "::error::Push rejected, ${TARGET_BRANCH} changed during the merge. Just re-run the workflow."
            exit 1
          fi

      - name: Summary (nothing to merge)
        if: steps.merge.outputs.skipped == 'true'
        run: |
          echo "### Nothing to merge into \`${{ inputs.target-branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ inputs.target-branch }}\` already contains every commit from \`${{ inputs.source-branch }}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "No merge, no commit and no push happened. Push new commits to \`${{ inputs.source-branch }}\` first, then start this workflow again." >> "$GITHUB_STEP_SUMMARY"

      - name: Summary
        if: steps.merge.outputs.skipped != 'true'
        run: |
          echo "### Merged into \`${{ inputs.target-branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Source: \`${{ inputs.source-branch }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**release.yml** runs on push to \`${{ inputs.target-branch }}\`." >> "$GITHUB_STEP_SUMMARY"
