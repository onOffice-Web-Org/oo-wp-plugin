name: PR Preview | Cleanup

# Removes everything a project preview left behind, once the last pull request
# for that project closes anywhere in the family.
#
# A project leaves three traces: this repo's build artifact on the update
# server (six WordPress repos only), the WordPress test box in the hosting UI,
# and the per-project marketplace/onMove instance on mptest.
#
# Pruning this repo's own artifact is bookkeeping and happens on every close.
# Everything else is governed by one shared counter: pull requests still open
# for the project across all eight repos. Only at zero do update-server folder,
# box and mptest instance go - together, so nothing half-torn-down is left.
#
# There used to be two counters with different semantics (open PRs here,
# manifest artifacts in the WordPress repos), and neither order ended clean at
# the moment it fired: the box outliving the onMove instance its
# customerAreaApiEndpoint points at, or instance and databases outliving the
# box. With one counter, "the last PR closed" has a single answer.
#
# The mptest key lives only in oo-web-marketplace and onmove-api. A WordPress
# repo therefore does not destroy the instance itself - it dispatches this same
# workflow in oo-web-marketplace with instance_only, which does that half.
#
# This file is identical in all eight sibling repos. The per-repo artifact
# name, type and folder are derived from the repo name below rather than set in
# an env block - that is exactly how the six WordPress copies drifted apart
# before.

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      project_number:
        description: "Project/ticket number (digits only, e.g. 167871) to clean up manually"
        required: true
        type: string
      instance_only:
        description: "Only destroy the mptest instance - used when a WordPress repo hands that half over"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  WP_REPOS: "onoffice-classic onoffice-modern onoffice-pure onoffice-timeless oo-wp-plugin oo-vue-addons"
  PROJECT_APP_REPOS: "oo-web-marketplace onmove-api"

jobs:
  determine-project:
    name: Determine project number
    runs-on: ubuntu-latest
    outputs:
      found: ${{ steps.project.outputs.found }}
      number: ${{ steps.project.outputs.number }}
    env:
      # Falls back to the current ref when there's no pull_request context
      # (i.e. a manual workflow_dispatch run).
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      INPUT_NUMBER: ${{ inputs.project_number }}
    steps:
      - name: Determine project number
        id: project
        run: |
          NUMBER="$INPUT_NUMBER"

          if [ -z "$NUMBER" ]; then
            # Match pr-preview-upload.yml's extraction (P#<digits>), so both
            # workflows always agree on which project a given branch maps to.
            NUMBER=$(grep -oP 'P#\K\d+' <<< "$PR_HEAD_REF" | head -1)
          fi

          if [ -z "$NUMBER" ]; then
            echo "::notice::No project number found in branch '${PR_HEAD_REF}' - nothing to clean up."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # This ends up inside a command run on the box, so refuse anything
          # that is not a plain number.
          if ! echo "$NUMBER" | grep -qE '^[0-9]+$'; then
            echo "::error::Project number '${NUMBER}' must be digits only (e.g. 167871)."
            exit 1
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=${NUMBER}" >> "$GITHUB_OUTPUT"

  cleanup:
    name: Clean up project preview
    needs: determine-project
    if: needs.determine-project.outputs.found == 'true'
    runs-on: ubuntu-latest
    # Keyed by project number, not PR number: a project spans several branches
    # and PRs across the family, and two of them closing back to back must not
    # race on the same manifest.json or the same instance.
    concurrency:
      group: pr-preview-cleanup-${{ needs.determine-project.outputs.number }}
      cancel-in-progress: false
    env:
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref || github.ref_name }}
      NUMBER: ${{ needs.determine-project.outputs.number }}
      INSTANCE_ONLY: ${{ inputs.instance_only == true }}
    steps:
      - name: Identify this repo's role
        id: role
        env:
          REPO: ${{ github.event.repository.name }}
        run: |
          # oo-wp-plugin is the one repo whose artifact is not named after it.
          case "$REPO" in
            onoffice-classic|onoffice-modern|onoffice-pure|onoffice-timeless)
              NAME="$REPO"; TYPE="theme"; DIR="themes" ;;
            oo-wp-plugin)
              NAME="onoffice-for-wp-websites"; TYPE="plugin"; DIR="plugins" ;;
            oo-vue-addons)
              NAME="$REPO"; TYPE="plugin"; DIR="plugins" ;;
            *)
              # The project-app repos deploy an instance instead of publishing
              # a manifest fragment - nothing of theirs is on the update server,
              # and only they hold the mptest key.
              NAME=""; TYPE=""; DIR="" ;;
          esac

          if [ -n "$TYPE" ]; then
            echo "${REPO} publishes the ${TYPE} artifact '${NAME}' and hands the mptest half over."
            echo "is_wp=true" >> "$GITHUB_OUTPUT"
          else
            echo "${REPO} publishes no build artifact and destroys the mptest instance itself."
            echo "is_wp=false" >> "$GITHUB_OUTPUT"
          fi

          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "type=${TYPE}" >> "$GITHUB_OUTPUT"
          echo "dir=${DIR}" >> "$GITHUB_OUTPUT"

      - name: Set up the update-server key
        if: env.INSTANCE_ONLY != 'true'
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_UPDATE_SERVER }}

      - name: Remove this repo's artifact and prune the manifest
        if: env.INSTANCE_ONLY != 'true' && steps.role.outputs.is_wp == 'true'
        env:
          ARTIFACT_NAME: ${{ steps.role.outputs.name }}
          ARTIFACT_TYPE: ${{ steps.role.outputs.type }}
          ARTIFACT_DIR: ${{ steps.role.outputs.dir }}
        run: |
          set -e

          SSH_OPTS="-o StrictHostKeyChecking=no"
          REMOTE="zipupload@dev.onoffice-wp-updates.de"
          REMOTE_DIR="pr-builds/P${NUMBER}"
          BASE_URL="https://dev.onoffice-wp-updates.de/pr-builds/P${NUMBER}"

          # No shell access assumed on the zipupload account - all remote
          # deletion goes through "rsync --delete" against an empty local
          # directory instead of an ssh rm -rf.
          EMPTY_DIR="$(mktemp -d)"

          HTTP_RESPONSE=$(curl -s -w "\n%{http_code}" "${BASE_URL}/manifest.json")
          HTTP_CODE=$(echo "$HTTP_RESPONSE" | tail -1)
          BODY=$(echo "$HTTP_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::No manifest for P${NUMBER} - nothing of ${ARTIFACT_NAME}'s is left there."
            exit 0
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Failed to fetch manifest for P${NUMBER} (HTTP ${HTTP_CODE})"
            exit 1
          fi

          echo "$BODY" | jq --arg name "$ARTIFACT_NAME" --arg type "$ARTIFACT_TYPE" \
            '[.[] | select(.name != $name or .type != $type)]' > pruned-manifest.json
          LEFT=$(jq 'length' pruned-manifest.json)

          echo "Removing ${ARTIFACT_TYPE} artifact '${ARTIFACT_NAME}' from P${NUMBER} (${LEFT} artifact(s) will remain)."
          rsync -e "ssh $SSH_OPTS" -rlt --delete --mkpath "${EMPTY_DIR}/" "${REMOTE}:${REMOTE_DIR}/${ARTIFACT_DIR}/${ARTIFACT_NAME}/"

          # Written back even when it is now an empty list. Whether the project
          # folder itself goes is decided by the PR count below, not by how many
          # artifacts happen to be left.
          rsync -e "ssh $SSH_OPTS" --mkpath pruned-manifest.json "${REMOTE}:${REMOTE_DIR}/manifest.json"

      - name: Create GitHub App token for the whole family
        if: env.INSTANCE_ONLY != 'true'
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.OO_ACTIONS_BOT_APP_ID }}
          private-key: ${{ secrets.OO_ACTIONS_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            onoffice-classic
            onoffice-modern
            onoffice-pure
            onoffice-timeless
            oo-wp-plugin
            oo-vue-addons
            oo-web-marketplace
            onmove-api

      - name: Count pull requests still open for this project
        if: env.INSTANCE_ONLY != 'true'
        id: remaining
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # The PR that triggered this run is already closed and so is not in
          # the open list any more. Anything still listed means someone is
          # working on the same project and needs box and instance to stay up.
          REMAINING=0

          for repo in $WP_REPOS $PROJECT_APP_REPOS; do
            REFS=$(gh api "repos/${OWNER}/${repo}/pulls?state=open&per_page=100" --paginate --jq '.[].head.ref')
            REFS_EXIT=$?

            if [ "$REFS_EXIT" -ne 0 ]; then
              echo "::error::Failed to list open PRs for ${repo} (gh exit ${REFS_EXIT}) - refusing to tear down p${NUMBER} on an incomplete answer."
              exit 1
            fi

            while IFS= read -r ref; do
              [ -z "$ref" ] && continue
              MATCH=$(grep -oP 'P#\K\d+' <<< "$ref" | head -1)
              if [ "$MATCH" = "$NUMBER" ]; then
                echo "${repo} still has an open PR on ${ref}"
                REMAINING=$((REMAINING + 1))
              fi
            done <<< "$REFS"
          done

          echo "Open PRs left for P${NUMBER}: ${REMAINING}"
          echo "remaining=${REMAINING}" >> "$GITHUB_OUTPUT"

      - name: Clear the project folder on the update server
        if: env.INSTANCE_ONLY != 'true' && steps.remaining.outputs.remaining == '0'
        run: |
          set -e

          SSH_OPTS="-o StrictHostKeyChecking=no"
          REMOTE="zipupload@dev.onoffice-wp-updates.de"
          EMPTY_DIR="$(mktemp -d)"

          echo "No PRs left for P${NUMBER} - clearing its folder on the update server."
          rsync -e "ssh $SSH_OPTS" -rlt --delete --mkpath "${EMPTY_DIR}/" "${REMOTE}:pr-builds/P${NUMBER}/"
          ssh $SSH_OPTS "${REMOTE}" "rmdir-pr-build P${NUMBER}"

      - name: Login to Hosting API
        if: env.INSTANCE_ONLY != 'true' && steps.remaining.outputs.remaining == '0'
        id: api-login
        run: |
          LOGIN_RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ secrets.HOSTING_API_URL }}/client-login" \
            -H "Content-Type: application/json" \
            -H "Accept: application/json" \
            -d '{
              "client_id": "${{ secrets.HOSTING_API_CLIENT_ID }}",
              "client_secret": "${{ secrets.HOSTING_API_CLIENT_SECRET }}"
            }')

          HTTP_CODE=$(echo "$LOGIN_RESPONSE" | tail -1)
          BODY=$(echo "$LOGIN_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::API Login fehlgeschlagen (HTTP ${HTTP_CODE})"
            exit 1
          fi

          TOKEN=$(echo "$BODY" | jq -r '.data.token')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Kein Token in Login-Response erhalten"
            exit 1
          fi

          echo "::add-mask::${TOKEN}"
          echo "token=${TOKEN}" >> "$GITHUB_OUTPUT"

      - name: Delete the test box via Hosting API
        if: env.INSTANCE_ONLY != 'true' && steps.remaining.outputs.remaining == '0'
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X DELETE \
            "${{ secrets.HOSTING_API_URL }}/test-environments/by-project/${NUMBER}" \
            -H "Authorization: Bearer ${{ steps.api-login.outputs.token }}" \
            -H "Accept: application/json")

          HTTP_CODE=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | sed '$d')

          echo "HTTP Status: ${HTTP_CODE}"
          echo "Response: ${BODY}"

          # A project that never had a box, or whose box a previous run already
          # removed, is a "nothing to do" - the end state is the same.
          if [ "$HTTP_CODE" = "404" ]; then
            echo "::notice::No test box for project ${NUMBER} - already gone."
            exit 0
          fi

          if [ "$HTTP_CODE" -ge 400 ]; then
            echo "::error::Box-Löschung fehlgeschlagen (HTTP ${HTTP_CODE}): ${BODY}"
            exit 1
          fi

      # Loaded here rather than at the top: a second ssh-agent call replaces the
      # agent, so the mptest key has to come after the update-server work is
      # done. Covers both ways in - this repo's own teardown and the half a
      # WordPress repo handed over.
      - name: Set up the mptest key
        if: >-
          env.INSTANCE_ONLY == 'true'
          || (steps.role.outputs.is_wp == 'false' && steps.remaining.outputs.remaining == '0')
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY_IONOS }}

      - name: Configure SSH for jump server
        if: >-
          env.INSTANCE_ONLY == 'true'
          || (steps.role.outputs.is_wp == 'false' && steps.remaining.outputs.remaining == '0')
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat > ~/.ssh/config << 'EOF'
          Host 217.154.241.45
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null

          Host ionos-mptest
            HostName 10.7.224.30
            User laravel
            ProxyJump laravel@217.154.241.45
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Destroy the project instance on mptest
        if: >-
          env.INSTANCE_ONLY == 'true'
          || (steps.role.outputs.is_wp == 'false' && steps.remaining.outputs.remaining == '0')
        run: |
          PROJECT_ID="p${NUMBER}"

          # Shares pr-preview-upload.yml's lock file on purpose: a destroy must
          # never run while a deploy is still installing into the same
          # directory. destroy-project itself is idempotent - it drops the
          # databases with IF EXISTS and skips a project directory that is
          # already gone.
          #
          # When this run was handed the job by a WordPress repo, that repo has
          # already established the count is zero - re-counting here would only
          # race with it.
          set +e
          ssh ionos-mptest \
            "flock -w 1800 -E 75 /tmp/deploy-project-${PROJECT_ID}.lock destroy-project ${PROJECT_ID}"
          RC=$?
          set -e

          if [ "$RC" -eq 75 ]; then
            echo "::error::Timed out after 30 min waiting for a deploy of ${PROJECT_ID} to release the lock on mptest."
            exit 1
          fi

          if [ "$RC" -ne 0 ]; then
            echo "::error::destroy-project ${PROJECT_ID} failed on mptest (exit ${RC})."
            exit "$RC"
          fi

      - name: Hand the mptest instance over to oo-web-marketplace
        if: env.INSTANCE_ONLY != 'true' && steps.remaining.outputs.remaining == '0' && steps.role.outputs.is_wp == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          # This repo has no mptest key. Only oo-web-marketplace and onmove-api
          # do, so the instance half runs there. Not fire and forget: if the
          # dispatch is lost, the instance and both databases stay up with
          # nothing left to clean them.
          REF=$(gh api "repos/${OWNER}/oo-web-marketplace" --jq '.default_branch')

          if ! jq -n --arg ref "$REF" --arg pn "$NUMBER" \
            '{ref: $ref, inputs: {project_number: $pn, instance_only: "true"}}' \
            | gh api "repos/${OWNER}/oo-web-marketplace/actions/workflows/pr-preview-cleanup.yml/dispatches" \
              -X POST --input -; then
            echo "::error::Could not hand p${NUMBER} over to oo-web-marketplace - its mptest instance and databases are still up. Run pr-preview-cleanup.yml there by hand with project_number=${NUMBER} and instance_only=true."
            exit 1
          fi

          echo "Handed the mptest instance for p${NUMBER} over to oo-web-marketplace."

      - name: Summary
        if: always()
        env:
          ARTIFACT_NAME: ${{ steps.role.outputs.name }}
          ARTIFACT_TYPE: ${{ steps.role.outputs.type }}
          IS_WP: ${{ steps.role.outputs.is_wp }}
          REMAINING: ${{ steps.remaining.outputs.remaining }}
        run: |
          if [ "$INSTANCE_ONLY" = "true" ]; then
            {
              echo "### PR Preview Cleanup (instance only)"
              echo ""
              echo "- Project: \`P${NUMBER}\`"
              echo "- mptest instance and databases destroyed on behalf of the dispatching repo."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          {
            echo "### PR Preview Cleanup"
            echo ""
            echo "- Project: \`P${NUMBER}\`"

            if [ "$IS_WP" = "true" ]; then
              echo "- Artifact removed: \`${ARTIFACT_NAME}\` (${ARTIFACT_TYPE})"
            else
              echo "- This repo publishes no build artifact."
            fi

            if [ -z "$REMAINING" ]; then
              echo "- Open PRs could not be counted - nothing was torn down."
            elif [ "$REMAINING" = "0" ]; then
              echo "- No PRs left open anywhere in the family."
              echo "- Update-server folder and test box removed."
              if [ "$IS_WP" = "true" ]; then
                echo "- mptest instance handed over to oo-web-marketplace."
              else
                echo "- mptest instance and databases destroyed."
              fi
            else
              echo "- \`${REMAINING}\` PR(s) still open for this project - box and instance kept."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
