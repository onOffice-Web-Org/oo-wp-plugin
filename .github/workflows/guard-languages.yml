name: guard-languages

on:
  pull_request:
    branches:
      - master
      - beta

permissions:
  contents: read

jobs:
  guard-languages:
    if: "!startsWith(github.head_ref, 'release')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: head
          fetch-depth: 0

      - name: Detect forbidden language changes
        shell: bash
        working-directory: head
        run: |
          set -euo pipefail

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"

          CHANGED="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          echo "Changed files:"
          printf "%s\n" "$CHANGED"

          # Only care about languages/onoffice-for-wp-websites-*.* changes
          TARGET_CHANGED="$(printf "%s\n" "$CHANGED" | grep -E '^languages/onoffice-for-wp-websites-[^/]+\.[^/]+$' || true)"

          if [ -z "$TARGET_CHANGED" ]; then
            echo "No changes in languages/onoffice-for-wp-websites-*.*, ok."
            exit 0
          fi

          # Allow only languages/onoffice-for-wp-websites-de_DE.po
          FORBIDDEN="$(printf "%s\n" "$TARGET_CHANGED" | grep -vE '^languages/onoffice-for-wp-websites-de_DE\.po$' || true)"

          if [ -n "$FORBIDDEN" ]; then
            echo "Forbidden changes detected in languages/onoffice-for-wp-websites-*.*:"
            printf "%s\n" "$FORBIDDEN"
            echo
            echo "Allowed only: languages/onoffice-for-wp-websites-de_DE.po"
            exit 1
          fi

          echo "Only allowed language change detected, ok."

      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # PHP is preinstalled on the runner, WP-CLI only needs it to run make-pot
      - name: Install WP-CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSLo "$RUNNER_TEMP/bin/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$RUNNER_TEMP/bin/wp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install gettext
        run: command -v msgmerge >/dev/null || (sudo apt-get update && sudo apt-get install -y gettext)

      - name: Detect missing German translations
        run: bash head/.github/scripts/check-translations.sh head base
